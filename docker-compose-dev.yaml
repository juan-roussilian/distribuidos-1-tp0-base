name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    networks: ['testing_net']
    volumes: ['./server/config.ini:/config/config.ini']
    environment: {'CLIENT_AMOUNT': 5}

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    networks: ['testing_net']
    depends_on: ['server']
    volumes: ['./client/config.yaml:/config/config.yaml', './.data/agency-1.csv:/bets.csv']
    environment: {'CLI_ID': '1', 'CLI_FIRST_NAME': 'Juan C.', 'CLI_LAST_NAME': 'Lopez', 'CLI_DOCUMENT': '30904465', 'CLI_BIRTH_DATE': '1999-03-17', 'CLI_NUMBER': '4'}

  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    networks: ['testing_net']
    depends_on: ['server']
    volumes: ['./client/config.yaml:/config/config.yaml', './.data/agency-2.csv:/bets.csv']
    environment: {'CLI_ID': '2', 'CLI_FIRST_NAME': 'Mark V.', 'CLI_LAST_NAME': 'Grayson', 'CLI_DOCUMENT': '23000000', 'CLI_BIRTH_DATE': '1967-12-12', 'CLI_NUMBER': '8'}

  client3:
    container_name: client3
    image: client:latest
    entrypoint: /client
    networks: ['testing_net']
    depends_on: ['server']
    volumes: ['./client/config.yaml:/config/config.yaml', './.data/agency-3.csv:/bets.csv']
    environment: {'CLI_ID': '3', 'CLI_FIRST_NAME': 'Carlo Antonio', 'CLI_LAST_NAME': 'Piastri', 'CLI_DOCUMENT': '23000001', 'CLI_BIRTH_DATE': '2000-01-01', 'CLI_NUMBER': '15'}

  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    networks: ['testing_net']
    depends_on: ['server']
    volumes: ['./client/config.yaml:/config/config.yaml', './.data/agency-4.csv:/bets.csv']
    environment: {'CLI_ID': '4', 'CLI_FIRST_NAME': 'Toshinori', 'CLI_LAST_NAME': 'Yagi', 'CLI_DOCUMENT': '23000002', 'CLI_BIRTH_DATE': '2014-04-02', 'CLI_NUMBER': '16'}

  client5:
    container_name: client5
    image: client:latest
    entrypoint: /client
    networks: ['testing_net']
    depends_on: ['server']
    volumes: ['./client/config.yaml:/config/config.yaml', './.data/agency-5.csv:/bets.csv']
    environment: {'CLI_ID': '5', 'CLI_FIRST_NAME': 'Hans J.', 'CLI_LAST_NAME': 'Muller', 'CLI_DOCUMENT': '23000003', 'CLI_BIRTH_DATE': '2005-03-17', 'CLI_NUMBER': '23'}

